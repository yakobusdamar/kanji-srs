<!DOCTYPE html>
<html class="light" lang="id">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>KanjiSRS - Flashcard</title>
    
    <!-- Google Fonts & Material Symbols -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Konfigurasi Tema Tailwind -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#15157d",
                        "primary-container": "#2e3192",
                        "on-primary": "#ffffff",
                        "secondary": "#b90538",
                        "secondary-container": "#dc2c4f",
                        "on-surface": "#1b1b21",
                        "on-surface-variant": "#464652",
                        "primary-fixed-dim": "#c0c1ff"
                    },
                    "spacing": {
                        "stack-lg": "2rem",
                        "stack-md": "1rem",
                        "container-margin": "2rem",
                        "stack-sm": "0.5rem",
                        "card-padding": "1.5rem", 
                        "card-padding-md": "2rem"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-md": ["Inter"]
                    }
                }
            }
        }
    </script>
    
    <style>
        .mesh-bg {
            background-color: #f0ecf5;
            background-image: 
                radial-gradient(at 10% 10%, rgba(163, 222, 254, 0.5) 0px, transparent 50%),
                radial-gradient(at 90% 10%, rgba(255, 186, 214, 0.4) 0px, transparent 50%),
                radial-gradient(at 50% 90%, rgba(214, 196, 255, 0.6) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .srs-btn-glass {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.2s ease-in-out;
        }

        .srs-btn-glass:hover {
            transform: scale(1.05);
        }

        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        /* Notifikasi Toast */
        #toast-container {
            position: fixed;
            top: 5rem;
            right: 50%;
            transform: translateX(50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            width: max-content;
            max-width: 90vw;
        }
        .toast {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(46, 49, 146, 0.2);
            padding: 0.75rem 1.25rem;
            border-radius: 999px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            color: #2e3192;
            font-size: 0.875rem;
            font-weight: 600;
            transition: opacity 0.3s, transform 0.3s;
            text-align: center;
        }
    </style>
</head>
<body class="mesh-bg text-on-surface min-h-screen flex flex-col font-body-md overflow-x-hidden">

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <!-- TopAppBar -->
    <header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-4 md:px-container-margin h-16 bg-white/30 dark:bg-white/10 backdrop-blur-xl border-b border-white/30 shadow-sm">
        <div class="font-headline-md text-xl md:text-2xl font-bold text-primary tracking-tight">
            KanjiSRS
        </div>
        <div class="flex items-center gap-2">
            <button onclick="triggerToast('Fitur impor data segera hadir!')" class="hidden md:block text-xs font-medium text-on-surface-variant hover:bg-white/40 px-3 py-1.5 rounded-full transition">
                Import
            </button>
            <button onclick="triggerToast('Fitur ekspor data segera hadir!')" class="text-xs font-bold text-primary hover:bg-white/50 px-3 py-1.5 rounded-full bg-white/40 border border-white/60 transition shadow-sm">
                Export Data
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow pt-20 pb-28 px-4 md:px-container-margin flex flex-col items-center justify-center w-full max-w-3xl mx-auto">
        
        <!-- Queue Status Pill Badges -->
        <div class="flex flex-wrap justify-center gap-2 mb-6 w-full">
            <div class="px-3 py-1 rounded-full bg-blue-100/60 border border-blue-200/50 backdrop-blur-md flex items-center gap-1.5 shadow-sm">
                <span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span>
                <span id="badge-new" class="text-[11px] md:text-xs text-blue-900 font-semibold">New: 0</span>
            </div>
            <div class="px-3 py-1 rounded-full bg-orange-100/60 border border-orange-200/50 backdrop-blur-md flex items-center gap-1.5 shadow-sm">
                <span class="w-1.5 h-1.5 rounded-full bg-orange-500"></span>
                <span id="badge-learning" class="text-[11px] md:text-xs text-orange-900 font-semibold">Learning: 0</span>
            </div>
            <div class="px-3 py-1 rounded-full bg-green-100/60 border border-green-200/50 backdrop-blur-md flex items-center gap-1.5 shadow-sm">
                <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>
                <span id="badge-review" class="text-[11px] md:text-xs text-green-900 font-semibold">Lulus: 0</span>
            </div>
        </div>

        <!-- Center Stage: Flashcard Container -->
        <div class="w-full max-w-[500px] glass-panel rounded-[2rem] p-card-padding md:p-card-padding-md shadow-lg flex flex-col items-center relative transition-transform duration-300">
            
            <!-- Kanji Display -->
            <div id="kanji-text" class="text-[80px] md:text-[120px] leading-none font-bold text-primary-container my-4 md:my-8 select-none text-center tracking-tighter">
                ⏳
            </div>

            <!-- STATE 1: UNFLIPPED (Show Answer Button) -->
            <button id="btn-show" class="w-full max-w-[240px] srs-btn-glass rounded-2xl py-3.5 px-6 mt-4 md:mt-8 flex items-center justify-center gap-2 group hidden shadow-sm">
                <span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform">visibility</span>
                <span class="text-base font-semibold text-primary">Tampilkan Jawaban</span>
            </button>

            <!-- STATE 2: FLIPPED (Revealed Content, Initially Hidden) -->
            <div id="revealed-section" class="hidden flex-col items-center text-center w-full mt-2">
                <div class="w-12 h-1 bg-primary/20 rounded-full mb-5"></div>
                
                <!-- Readings Area (Onyomi & Kunyomi) -->
                <div class="w-full bg-white/40 rounded-xl p-4 mb-4 border border-white/50 shadow-inner">
                    <div class="flex flex-col gap-3">
                        <div class="flex flex-col md:flex-row md:items-center md:justify-center gap-1 md:gap-3 text-sm">
                            <span class="font-semibold text-primary/70 text-[11px] uppercase tracking-wider">Onyomi (音読み)</span>
                            <span id="kanji-onyomi" class="font-medium text-primary-container text-base">-</span>
                        </div>
                        <div class="w-full h-[1px] bg-primary/10 hidden md:block"></div>
                        <div class="flex flex-col md:flex-row md:items-center md:justify-center gap-1 md:gap-3 text-sm">
                            <span class="font-semibold text-secondary/70 text-[11px] uppercase tracking-wider">Kunyomi (訓読み)</span>
                            <span id="kanji-kunyomi" class="font-medium text-secondary-container text-base">-</span>
                        </div>
                    </div>
                </div>

                <!-- Meaning Area -->
                <p id="kanji-meaning" class="text-lg md:text-xl font-bold text-primary/90 mb-6">
                    Arti: -
                </p>

                <!-- Desktop SRS Action Buttons (Hanya Sulit & Mudah) -->
                <div class="hidden md:flex gap-4 w-full mt-2 justify-center">
                    <button class="srs-action-btn flex-1 max-w-[150px] srs-btn-glass rounded-xl py-3 flex flex-col items-center justify-center gap-1 hover:bg-rose-100/80 group border-rose-200/50" data-grade="hard">
                        <span class="material-symbols-outlined text-rose-600 text-[24px] group-hover:-translate-y-1 transition-transform">close</span>
                        <span class="text-[12px] font-bold text-rose-700 uppercase tracking-wide">Sulit</span>
                    </button>
                    <button class="srs-action-btn flex-1 max-w-[150px] srs-btn-glass rounded-xl py-3 flex flex-col items-center justify-center gap-1 hover:bg-teal-100/80 group border-teal-200/50" data-grade="easy">
                        <span class="material-symbols-outlined text-teal-600 text-[24px] group-hover:-translate-y-1 transition-transform">check</span>
                        <span class="text-[12px] font-bold text-teal-700 uppercase tracking-wide">Mudah</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- BottomNavBar (Mobile Only) - Hanya Sulit & Mudah -->
    <nav id="mobile-srs-nav" class="hidden md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-between items-center px-4 py-3 pb-safe bg-white/60 backdrop-blur-xl border-t border-white/40 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] animate-fade-in gap-3">
        <button class="srs-action-btn flex-1 flex items-center justify-center gap-2 bg-rose-100/80 text-rose-700 py-3 rounded-xl border border-rose-200/50 hover:bg-rose-200/80 active:scale-95 transition" data-grade="hard">
            <span class="material-symbols-outlined text-[20px]">close</span>
            <span class="text-sm font-bold uppercase tracking-wide">Sulit</span>
        </button>
        <button class="srs-action-btn flex-1 flex items-center justify-center gap-2 bg-teal-500 text-white py-3 rounded-xl shadow-lg shadow-teal-500/30 hover:bg-teal-600 active:scale-95 transition" data-grade="easy">
            <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check</span>
            <span class="text-sm font-bold uppercase tracking-wide">Mudah</span>
        </button>
    </nav>

    <!-- Logika Aplikasi (JavaScript) -->
    <script>
        // State Aplikasi
        let reviewQueue = []; // Antrean kartu yang akan direview
        let currentCard = null;
        let stats = { new: 0, learning: 0, graduated: 0 }; // 'graduated' untuk yang Mudah/Lulus

        // Elemen DOM
        const btnShow = document.getElementById('btn-show');
        const revealedSection = document.getElementById('revealed-section');
        const mobileNav = document.getElementById('mobile-srs-nav');
        
        const kanjiText = document.getElementById('kanji-text');
        const kanjiOnyomi = document.getElementById('kanji-onyomi');
        const kanjiKunyomi = document.getElementById('kanji-kunyomi');
        const kanjiMeaning = document.getElementById('kanji-meaning');
        
        const srsButtons = document.querySelectorAll('.srs-action-btn');
        const badgeNew = document.getElementById('badge-new');
        const badgeLearning = document.getElementById('badge-learning');
        const badgeReview = document.getElementById('badge-review'); // Ini sekarang untuk 'Lulus'

        // Mengambil data JSON (FULL 80+ Kanji)
        async function loadDeck() {
            try {
                kanjiText.innerText = '⏳';
                kanjiText.classList.add('animate-pulse');
                
                const response = await fetch('n5_kanji.json');
                if (!response.ok) throw new Error('Gagal memuat data');
                
                const rawDeck = await response.json();
                
                // Masukkan SEMUA kartu ke antrean dengan status awal 'new'
                reviewQueue = rawDeck.map(card => ({
                    ...card,
                    status: 'new' // new | learning
                }));
                
                // Acak urutan array (opsional, agar tiap mulai tidak dari Ichi, Ni, San terus)
                // reviewQueue = reviewQueue.sort(() => Math.random() - 0.5);
                
                stats.new = reviewQueue.length;
                
                kanjiText.classList.remove('animate-pulse');
                btnShow.classList.remove('hidden');
                
                renderNextCard();
                updateBadges();
            } catch (error) {
                console.error(error);
                kanjiText.innerText = '⚠️';
                kanjiText.classList.remove('animate-pulse');
                kanjiText.style.fontSize = '60px';
                kanjiOnyomi.innerText = 'Error';
                kanjiKunyomi.innerText = '-';
                kanjiMeaning.innerText = 'Gagal memuat n5_kanji.json. Jalankan via Web Server.';
                revealedSection.classList.remove('hidden');
                revealedSection.classList.add('flex');
            }
        }

        // Fungsi merender kartu dari urutan terdepan antrean
        function renderNextCard() {
            if (reviewQueue.length === 0) {
                // Antrean habis
                kanjiText.innerText = '🎉';
                kanjiText.style.fontSize = '80px';
                kanjiMeaning.innerText = 'Luar Biasa! Semua kanji telah diselesaikan.';
                revealedSection.classList.remove('hidden');
                revealedSection.classList.add('flex');
                
                // Sembunyikan readings dan tombol
                document.querySelector('.bg-white\\/40').classList.add('hidden'); // Kotak reading
                document.querySelector('.md\\:flex.gap-4').classList.add('hidden'); // Tombol desktop
                btnShow.classList.add('hidden');
                mobileNav.classList.add('hidden');
                return;
            }

            // Ambil kartu paling depan (index 0)
            currentCard = reviewQueue[0];
            
            kanjiText.innerText = currentCard.char;
            kanjiOnyomi.innerText = currentCard.onyomi || '-';
            kanjiKunyomi.innerText = currentCard.kunyomi || '-';
            kanjiMeaning.innerText = `${currentCard.meaning}`;
        }

        // Tampilkan Jawaban (Flipping)
        btnShow.addEventListener('click', () => {
            btnShow.classList.add('hidden');
            revealedSection.classList.remove('hidden');
            revealedSection.classList.add('flex', 'animate-fade-in');
            mobileNav.classList.remove('hidden');
            mobileNav.classList.add('flex');
        });

        // Logika Antrean (Simplified SRS Algorithm)
        srsButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                if (!currentCard) return;

                const grade = e.currentTarget.getAttribute('data-grade');
                
                // 1. Keluarkan kartu dari antrean terdepan
                const processedCard = reviewQueue.shift();

                // 2. Kurangi stats berdasarkan status asalnya
                if (processedCard.status === 'new') stats.new--;
                if (processedCard.status === 'learning') stats.learning--;

                // 3. Tentukan nasib kartu ini berdasarkan tombol yang ditekan
                if (grade === 'hard') {
                    // Jika Sulit: Ubah status ke learning, dan MASUKKAN KEMBALI ke antrean
                    processedCard.status = 'learning';
                    stats.learning++;
                    
                    // Algoritma: Sisipkan setelah 4 kartu berikutnya (agar tidak muncul berturut-turut langsung)
                    // Jika sisa antrean kurang dari 4, taruh di paling belakang.
                    const insertIndex = Math.min(4, reviewQueue.length); 
                    reviewQueue.splice(insertIndex, 0, processedCard);
                    
                } else if (grade === 'easy') {
                    // Jika Mudah: Kartu tidak dimasukkan kembali ke antrean (Lulus)
                    stats.graduated++;
                }

                updateBadges();

                // 4. Lanjut ke kartu berikutnya
                setTimeout(() => {
                    resetCardUI();
                    renderNextCard();
                }, 100); 
            });
        });

        // Reset UI untuk kartu baru
        function resetCardUI() {
            revealedSection.classList.add('hidden');
            revealedSection.classList.remove('flex', 'animate-fade-in');
            mobileNav.classList.add('hidden');
            mobileNav.classList.remove('flex');

            if (reviewQueue.length > 0) {
                btnShow.classList.remove('hidden');
            }
        }

        function updateBadges() {
            badgeNew.innerText = `New: ${stats.new}`;
            badgeLearning.innerText = `Learning: ${stats.learning}`;
            badgeReview.innerText = `Lulus: ${stats.graduated}`;
        }

        function triggerToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px) translateX(50%)'; // maintain center positioning
                setTimeout(() => {
                    if (container.contains(toast)) container.removeChild(toast);
                }, 300);
            }, 2000);
        }

        // Mulai memuat saat dibuka
        loadDeck();
    </script>
</body>
</html>
