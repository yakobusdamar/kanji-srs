<!DOCTYPE html>
<html class="light" lang="id">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>KanjiSRS - Flashcard Interface</title>
    
    <!-- Google Fonts & Material Symbols -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Konfigurasi Tema Tailwind -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#15157d",
                        "primary-container": "#2e3192",
                        "on-primary": "#ffffff",
                        "secondary": "#b90538",
                        "secondary-container": "#dc2c4f",
                        "on-surface": "#1b1b21",
                        "on-surface-variant": "#464652",
                        "primary-fixed-dim": "#c0c1ff"
                    },
                    "spacing": {
                        "stack-lg": "2rem",
                        "stack-md": "1rem",
                        "container-margin": "2rem",
                        "stack-sm": "0.5rem",
                        "card-padding": "2rem"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "kanji-display": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "kanji-display": ["120px", { "lineHeight": "140px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
    
    <!-- Custom CSS untuk Glassmorphism & Mesh Background -->
    <style>
        .mesh-bg {
            background-color: #f0ecf5;
            background-image: 
                radial-gradient(at 10% 10%, rgba(163, 222, 254, 0.5) 0px, transparent 50%),
                radial-gradient(at 90% 10%, rgba(255, 186, 214, 0.4) 0px, transparent 50%),
                radial-gradient(at 50% 90%, rgba(214, 196, 255, 0.6) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .srs-btn-glass {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.2s ease-in-out;
        }

        .srs-btn-glass:hover {
            transform: scale(1.05);
        }

        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* Notifikasi Toast */
        #toast-container {
            position: fixed;
            top: 5rem;
            right: 2rem;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .toast {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            color: #2e3192;
            font-weight: 600;
            transition: opacity 0.3s, transform 0.3s;
        }
    </style>
</head>
<body class="mesh-bg text-on-surface min-h-screen flex flex-col font-body-md overflow-x-hidden">

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <!-- TopAppBar -->
    <header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-margin h-16 bg-white/20 dark:bg-white/10 backdrop-blur-xl border-b border-white/30 shadow-[0_30px_60px_-15px_rgba(46,49,146,0.1)]">
        <div class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">
            KanjiSRS
        </div>
        <div class="flex items-center gap-4 hidden md:flex">
            <button onclick="triggerToast('Data diimpor dari Local Storage!')" class="font-label-sm text-label-sm text-on-surface-variant font-medium hover:bg-white/30 transition-all duration-300 px-4 py-2 rounded-full border border-transparent">
                Import
            </button>
            <button onclick="triggerToast('Data berhasil diekspor ke format JSON!')" class="font-label-sm text-label-sm text-primary font-bold hover:bg-white/30 transition-all duration-300 px-4 py-2 rounded-full bg-white/40 border border-white/50">
                Export
            </button>
        </div>
        <div class="md:hidden flex items-center gap-2">
            <span class="material-symbols-outlined text-primary cursor-pointer hover:scale-110 transition-transform">menu</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow pt-24 pb-32 px-5 md:px-container-margin flex flex-col items-center justify-center max-w-[1200px] mx-auto w-full">
        
        <!-- Queue Status Pill Badges -->
        <div class="flex flex-wrap justify-center gap-3 mb-stack-lg w-full max-w-2xl">
            <div class="px-4 py-1.5 rounded-full bg-blue-100/50 border border-blue-200 backdrop-blur-md flex items-center gap-2 shadow-sm">
                <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                <span id="badge-new" class="font-label-sm text-label-sm text-blue-900 font-semibold">New: 0</span>
            </div>
            <div class="px-4 py-1.5 rounded-full bg-orange-100/50 border border-orange-200 backdrop-blur-md flex items-center gap-2 shadow-sm">
                <span class="w-2 h-2 rounded-full bg-orange-500"></span>
                <span id="badge-learning" class="font-label-sm text-label-sm text-orange-900 font-semibold">Learning: 0</span>
            </div>
            <div class="px-4 py-1.5 rounded-full bg-green-100/50 border border-green-200 backdrop-blur-md flex items-center gap-2 shadow-sm">
                <span class="w-2 h-2 rounded-full bg-green-500"></span>
                <span id="badge-review" class="font-label-sm text-label-sm text-green-900 font-semibold">Review: 0</span>
            </div>
        </div>

        <!-- Center Stage: Flashcard Container -->
        <div class="w-full max-w-2xl glass-panel rounded-3xl p-card-padding shadow-[0_30px_60px_-15px_rgba(46,49,146,0.05)] flex flex-col items-center relative overflow-hidden transition-transform duration-300 hover:scale-[1.01]">
            
            <!-- Kanji Display -->
            <div id="kanji-text" class="font-kanji-display text-kanji-display text-primary-container my-stack-lg select-none text-center">
                ⏳
            </div>

            <!-- STATE 1: UNFLIPPED (Show Answer Button) -->
            <button id="btn-show" class="w-full max-w-xs srs-btn-glass rounded-full py-4 px-8 mt-stack-lg flex items-center justify-center gap-2 group hidden">
                <span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform">visibility</span>
                <span class="font-headline-md text-headline-md text-primary">Tampilkan</span>
            </button>

            <!-- STATE 2: FLIPPED (Revealed Content, Initially Hidden) -->
            <div id="revealed-section" class="hidden flex-col items-center text-center mb-stack-md w-full">
                <div class="w-16 h-1 bg-white/50 rounded-full mb-6"></div>
                <h2 id="kanji-reading" class="font-headline-lg text-headline-lg text-primary-container mb-2">
                    -
                </h2>
                <p id="kanji-meaning" class="font-body-lg text-body-lg text-primary/80 mb-stack-lg">
                    Arti: -
                </p>

                <!-- Desktop SRS Action Buttons -->
                <div class="hidden md:grid grid-cols-2 md:grid-cols-4 gap-3 w-full mt-stack-sm">
                    <button class="srs-action-btn srs-btn-glass rounded-full py-3 px-4 flex flex-col items-center justify-center gap-1 hover:bg-rose-100/60 group" data-grade="again">
                        <span class="material-symbols-outlined text-rose-600 group-hover:-translate-y-1 transition-transform">replay</span>
                        <span class="font-label-sm text-label-sm text-rose-700">Lagi</span>
                    </button>
                    <button class="srs-action-btn srs-btn-glass rounded-full py-3 px-4 flex flex-col items-center justify-center gap-1 hover:bg-amber-100/60 group" data-grade="hard">
                        <span class="material-symbols-outlined text-amber-600 group-hover:-translate-y-1 transition-transform">speed</span>
                        <span class="font-label-sm text-label-sm text-amber-700">Sulit</span>
                    </button>
                    <button class="srs-action-btn srs-btn-glass rounded-full py-3 px-4 flex flex-col items-center justify-center gap-1 hover:bg-teal-100/60 group" data-grade="good">
                        <span class="material-symbols-outlined text-teal-600 group-hover:-translate-y-1 transition-transform">sentiment_satisfied</span>
                        <span class="font-label-sm text-label-sm text-teal-700">Bagus</span>
                    </button>
                    <button class="srs-action-btn srs-btn-glass rounded-full py-3 px-4 flex flex-col items-center justify-center gap-1 hover:bg-sky-100/60 group" data-grade="easy">
                        <span class="material-symbols-outlined text-sky-600 group-hover:-translate-y-1 transition-transform">rocket_launch</span>
                        <span class="font-label-sm text-label-sm text-sky-700">Mudah</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- BottomNavBar (Mobile Only) - Initially Hidden until flipped -->
    <nav id="mobile-srs-nav" class="hidden md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 pb-safe bg-white/20 dark:bg-white/10 backdrop-blur-xl border-t border-white/30 rounded-t-xl shadow-[0_-10px_40px_rgba(46,49,146,0.05)] animate-fade-in">
        <button class="srs-action-btn flex flex-col items-center justify-center text-rose-600 px-6 py-2 hover:bg-white/30 transition-all duration-200" data-grade="again">
            <span class="material-symbols-outlined mb-1">replay</span>
            <span class="font-label-sm text-label-sm">Lagi</span>
        </button>
        <button class="srs-action-btn flex flex-col items-center justify-center text-amber-600 px-6 py-2 hover:bg-white/30 transition-all duration-200" data-grade="hard">
            <span class="material-symbols-outlined mb-1">speed</span>
            <span class="font-label-sm text-label-sm">Sulit</span>
        </button>
        <button class="srs-action-btn flex flex-col items-center justify-center bg-white/40 dark:bg-white/20 text-teal-600 rounded-full px-6 py-2 hover:bg-white/30 transition-all duration-200 scale-110" data-grade="good">
            <span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">sentiment_satisfied</span>
            <span class="font-label-sm text-label-sm">Bagus</span>
        </button>
        <button class="srs-action-btn flex flex-col items-center justify-center text-sky-600 px-6 py-2 hover:bg-white/30 transition-all duration-200" data-grade="easy">
            <span class="material-symbols-outlined mb-1">rocket_launch</span>
            <span class="font-label-sm text-label-sm">Mudah</span>
        </button>
    </nav>

    <!-- Logika Aplikasi (JavaScript) -->
    <script>
        // State Aplikasi
        let deck = [];
        let currentIndex = 0;
        let stats = { new: 0, learning: 0, review: 0 };

        // Elemen DOM
        const btnShow = document.getElementById('btn-show');
        const revealedSection = document.getElementById('revealed-section');
        const mobileNav = document.getElementById('mobile-srs-nav');
        
        const kanjiText = document.getElementById('kanji-text');
        const kanjiReading = document.getElementById('kanji-reading');
        const kanjiMeaning = document.getElementById('kanji-meaning');
        
        const srsButtons = document.querySelectorAll('.srs-action-btn');
        const badgeNew = document.getElementById('badge-new');
        const badgeLearning = document.getElementById('badge-learning');
        const badgeReview = document.getElementById('badge-review');

        // Fungsi untuk mengambil data JSON asinkron
        async function loadDeck() {
            try {
                kanjiText.innerText = '⏳';
                kanjiText.classList.add('animate-pulse');
                
                const response = await fetch('n5_kanji.json');
                if (!response.ok) throw new Error('Gagal memuat data');
                
                deck = await response.json();
                
                // Setel stats awal berdasarkan jumlah kartu yang di-load
                stats.new = deck.length;
                stats.learning = 0;
                stats.review = 0;
                
                kanjiText.classList.remove('animate-pulse');
                btnShow.classList.remove('hidden'); // Tampilkan tombol setelah data siap
                
                renderCard();
                updateBadges();
                triggerToast(`${deck.length} kartu N5 berhasil dimuat!`);
            } catch (error) {
                console.error(error);
                kanjiText.innerText = '⚠️';
                kanjiText.classList.remove('animate-pulse');
                kanjiText.style.fontSize = '80px';
                kanjiReading.innerText = 'Error';
                kanjiMeaning.innerText = 'Gagal memuat file n5_kanji.json. Pastikan file berada di folder yang sama dan diakses melalui web server (seperti GitHub Pages atau Live Server).';
                revealedSection.classList.remove('hidden');
                revealedSection.classList.add('flex');
            }
        }

        // Fungsi untuk merender kartu saat ini
        function renderCard() {
            if (currentIndex >= deck.length) {
                // Jika deck habis
                kanjiText.innerText = '🎉';
                kanjiText.style.fontSize = '80px';
                kanjiReading.innerText = 'Selesai!';
                kanjiMeaning.innerText = 'Semua kartu untuk hari ini telah dipelajari.';
                btnShow.classList.add('hidden');
                return;
            }

            const card = deck[currentIndex];
            kanjiText.innerText = card.char;
            kanjiReading.innerText = card.reading;
            kanjiMeaning.innerText = `Arti: ${card.meaning}`;
        }

        // Fungsi Tampilkan Jawaban (Flipping)
        btnShow.addEventListener('click', () => {
            btnShow.classList.add('hidden');
            
            revealedSection.classList.remove('hidden');
            revealedSection.classList.add('flex', 'animate-fade-in');
            
            // Tampilkan navigasi mobile jika layar kecil
            mobileNav.classList.remove('hidden');
            mobileNav.classList.add('flex');
        });

        // Event Listener untuk tombol Evaluasi SRS
        srsButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const grade = e.currentTarget.getAttribute('data-grade');
                
                // --- Logika Simulasi SRS ---
                // Kartu status "New" dikurangi
                if (stats.new > 0) stats.new--;
                
                // Jika user menekan "Again" atau "Hard", masukkan ke Learning
                if (grade === 'again' || grade === 'hard') {
                    stats.learning++;
                } else {
                    stats.review++;
                }

                updateBadges();

                // Pindah ke kartu berikutnya setelah jeda singkat
                setTimeout(() => {
                    currentIndex++;
                    resetCardUI();
                    renderCard();
                }, 200); 
            });
        });

        // Reset tampilan UI agar tertutup kembali
        function resetCardUI() {
            revealedSection.classList.add('hidden');
            revealedSection.classList.remove('flex', 'animate-fade-in');
            
            mobileNav.classList.add('hidden');
            mobileNav.classList.remove('flex');

            if (currentIndex < deck.length) {
                btnShow.classList.remove('hidden');
            }
        }

        // Perbarui angka di Pills/Badges
        function updateBadges() {
            badgeNew.innerText = `New: ${stats.new}`;
            badgeLearning.innerText = `Learning: ${stats.learning}`;
            badgeReview.innerText = `Review: ${stats.review}`;
        }

        // Fungsi Toast Notification (Sebagai pengganti alert)
        function triggerToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = message;
            
            container.appendChild(toast);

            // Hilangkan toast setelah 3 detik
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                setTimeout(() => {
                    if (container.contains(toast)) {
                        container.removeChild(toast);
                    }
                }, 300);
            }, 3000);
        }

        // Inisialisasi awal saat halaman dimuat
        loadDeck();
    </script>
</body>
</html>
